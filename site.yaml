  entorno:
    activa: true
    antetitulo: El entorno
    titulo: Montaña, río y pueblos de piedra
    texto: "Estamos en la puerta de los Picos de Europa. En recepción te contamos qué ruta hacer según el tiempo y las ganas."
    actividades:
      - titulo: Ruta del Cares
        texto: "La garganta excavada en la roca entre Poncebos y Caín. La más famosa de los Picos."
        distancia: "A 2 km"
        imagen: /fotos/entorno-cares.jpg
        imagenes: "/fotos/galeria-3.jpg"
        detalle: |
          Es la ruta más conocida de los Picos de Europa y empieza casi en la puerta del camping. El camino va tallado en la pared de la garganta, colgado sobre el río, entre Poncebos y Caín, con túneles, puentes y vistas que no se olvidan.

          Apenas tiene subidas salvo al principio, así que la hace mucha gente, también con niños mayores. Conviene salir temprano en verano para evitar el calor y las aglomeraciones, llevar agua y calzado de montaña.

          Si no quieres hacerla entera, basta con caminar desde Poncebos hasta el primer tramo de túneles y volver. En recepción te explicamos cómo combinarla con la vuelta en taxi.
      - titulo: Lagos de Covadonga
        texto: "Los lagos Enol y Ercina, con vacas pastando y la montaña reflejada en el agua."
        distancia: "A 45 minutos en coche"
        imagen: /fotos/entorno-lagos.jpg
        detalle: |
          Los lagos Enol y Ercina están en lo alto del macizo occidental, rodeados de pastos y de cumbres de caliza. Un paseo circular sencillo une los dos lagos y pasa por varios miradores.

          En temporada alta la subida en coche está regulada y se hace en autobús desde Cangas de Onís. Te recomendamos ir a primera hora, cuando la niebla se levanta del agua y apenas hay nadie.

          De vuelta, merece la pena parar en el santuario de Covadonga y comer en algún pueblo del camino.
      - titulo: Descenso del Sella
        texto: "Canoa por el río entre Arriondas y Llovio, un plan para toda la familia."
        distancia: "A 40 minutos en coche"
        imagen: /fotos/entorno-sella.jpg
        detalle: |
          Bajar el Sella en canoa es uno de los planes más divertidos de la zona y no hace falta experiencia: en verano el río va tranquilo y hay recorridos cortos para ir con niños.

          Las empresas de Arriondas alquilan la canoa y los chalecos y te recogen al final con su furgoneta. Lleva ropa que se pueda mojar, calzado de agua y crema para el sol.

          Si quieres, te ayudamos a reservar con alguna de las empresas que conocemos.
      - titulo: Bulnes
        texto: "El pueblo sin carretera, al que se sube a pie o en funicular desde Poncebos."
        distancia: "A 3 km"
        imagen: /fotos/entorno-bulnes.jpg

