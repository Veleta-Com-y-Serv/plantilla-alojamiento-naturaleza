    testimonios:
      - { texto: "Las parcelas son enormes y con sombra, y el río está ahí mismo. Los niños no salieron del agua en toda la semana.", autor: Familia Robles, nota: "Agosto de 2026" }
      - { texto: "Dormir en la tienda safari y ver las estrellas desde la terraza fue lo mejor del viaje. Todo muy limpio y cuidado.", autor: Lucía y Marcos, nota: "Julio de 2026" }
      - { texto: "Hicimos la Ruta del Cares saliendo andando desde el camping. Marta nos dio mil consejos. Volveremos en otoño.", autor: Andrés G., nota: "Septiembre de 2026" }

  como-llegar:
