  alojamiento:
    activa: true
    antetitulo: El lugar
    titulo: Una vega verde entre montañas
    texto: |
      La Vega del Cares es una finca de prado y fresnos a la orilla del río, en la entrada de los Picos de Europa. Empezó como el prado de la familia y hoy es un camping pequeño, con sitio de sobra entre parcela y parcela, unos pocos bungalows y la casa de piedra donde vivieron los abuelos.

      Aquí se viene a caminar, a bañarse en el río y a no hacer nada a la sombra. Por la mañana se oye el agua; por la noche, los grillos y poco más.
    firma: "Marta y Xuacu, la familia que lo lleva"
    imagen: /fotos/casa.jpg
    foto: /fotos/casa-detalle.jpg
    cta: { texto: Ver dónde dormir, url: "/#alojamientos" }

  alojamientos:
    activa: true
    antetitulo: Dónde dormir
    titulo: Cuatro maneras de quedarse
    texto: "De la parcela para tu tienda a la casa entera para la familia. Todos con el río a un paso y la montaña de frente."
    alojamientos:
      - nombre: Casa rural El Hórreo
        categoria: Casa rural
        texto: "La casa de piedra de la familia, con corredor de madera, chimenea y un prado propio. Se alquila entera."
        precio: "desde 160 €/noche"
        personas: "Hasta 6 personas"
        extras: "Tres dormitorios, chimenea, cocina completa, jardín con barbacoa"
        imagen: /fotos/aloj-casa.jpg
        imagenes: "/fotos/casa.jpg; /fotos/casa-detalle.jpg; /fotos/galeria-7.jpg"
        detalle: |
          Es la casa donde vivieron los abuelos, rehabilitada con cuidado: muros de piedra, vigas de castaño y un corredor de madera que mira a las montañas. Se alquila entera, así que el prado de delante y el hórreo son solo para quien se aloja.

          Abajo están el salón con chimenea, la cocina completa y una mesa larga para comer todos juntos. Arriba, tres dormitorios: uno de matrimonio con salida al corredor, otro con dos camas y un tercero con litera, pensado para los niños. Hay dos baños completos.

          Es la opción para familias y grupos de amigos que quieren la tranquilidad de una casa propia y, a la vez, la piscina y el bar del camping a dos minutos andando. En invierno dejamos leña preparada junto a la chimenea.
      - nombre: Bungalow Ribera
        categoria: Bungalow
        texto: "Bungalow de madera con porche, dos dormitorios y cocina, entre fresnos y a cincuenta metros del río."
        precio: "desde 95 €/noche"
        personas: "Hasta 4 personas"
        extras: "Dos dormitorios, baño completo, cocina equipada, porche con mesa"
        imagen: /fotos/aloj-bungalow.jpg
        imagenes: "/fotos/aloj-bungalow-dentro.jpg; /fotos/galeria-1.jpg"
        detalle: |
          Los bungalows están en la parte más tranquila de la finca, entre fresnos y nogales, con el río a cincuenta metros. Son de madera, luminosos y con un porche cubierto donde se desayuna mirando la montaña.

          Dentro hay un dormitorio de matrimonio, otro con dos camas, un baño completo y una cocina con todo lo necesario para hacer vida sin salir. La ropa de cama y las toallas van incluidas, y la calefacción hace que también apetezcan en primavera y en otoño.

          Van bien a familias con niños y a parejas que quieren algo más de espacio que una tienda. Desde la puerta se llega a la piscina, al parque infantil y al camino que baja hasta la playa de piedras del río.
      - nombre: Tienda safari
        categoria: Glamping
        texto: "Tienda de lona sobre tarima de madera, con cama de verdad, luz y una terraza para ver las estrellas."
        precio: "desde 75 €/noche"
        personas: "2 personas"
        extras: "Cama de matrimonio, luz y enchufes, terraza privada, baños del camping a dos pasos"
        imagen: /fotos/aloj-glamping.jpg
        imagenes: "/fotos/aloj-glamping-dentro.jpg; /fotos/galeria-4.jpg"
        detalle: |
          Para dormir al aire libre sin renunciar a una buena cama. Las tiendas safari son de lona gruesa, están montadas sobre una tarima de madera y tienen una terraza privada con dos tumbonas.

          Dentro esperan una cama de matrimonio con ropa de algodón, mantas de lana, mesillas con luz y enchufes para cargar el teléfono. Los baños y las duchas del camping están a dos pasos, siempre limpios.

          Es lo que más piden las parejas en verano: de noche, con el cielo despejado, desde la terraza se ve la Vía Láctea. Abren de mayo a septiembre.
      - nombre: Parcelas junto al río
        categoria: Parcela
        texto: "Parcelas amplias de hierba, con sombra y enchufe, para tienda, caravana o autocaravana."
        precio: "desde 28 €/noche"
        personas: "Hasta 6 personas"
        extras: "Toma de luz, sombra de árboles, agua cerca, mascotas admitidas"
        imagen: /fotos/aloj-parcela.jpg
    cta: { texto: Consultar disponibilidad, url: "/#reservas" }

