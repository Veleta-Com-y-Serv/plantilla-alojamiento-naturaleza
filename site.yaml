    antetitulo: Cómo llegar
    titulo: A la entrada de los Picos de Europa
    texto: "Estamos en la carretera de Poncebos, a dos kilómetros de Arenas de Cabrales. La entrada está señalizada junto al puente."
    imagen: /fotos/llegar.jpg
    cta: { texto: Abrir en Google Maps, url: "" }
    items:
      - { titulo: En coche, texto: "Desde Oviedo por la A-64 y la AS-114, en 1 h 20 min. Desde Santander por la A-8, en 1 h 30 min.", icono: coche }
      - { titulo: En autobús, texto: "Hay autobuses diarios de Oviedo a Arenas de Cabrales. Desde la parada, 25 minutos a pie o un taxi.", icono: bus }
      - { titulo: En avión, texto: "El aeropuerto de Asturias está a una hora y media; el de Santander, a una hora y cuarenta.", icono: avion }

  preguntas:
    activa: true
    antetitulo: Preguntas frecuentes
    titulo: Antes de venir
    preguntas:
      - { pregunta: "¿Se admiten perros?", respuesta: "Sí, en las parcelas y en los bungalows, con aviso al reservar. En la piscina y en el bar, no." }
      - { pregunta: "¿Hay que reservar parcela?", respuesta: "En julio, agosto y puentes, sí. El resto del año suele haber sitio, pero escríbenos antes para asegurarte." }
      - { pregunta: "¿La ropa de cama está incluida?", respuesta: "En la casa rural, los bungalows y las tiendas safari, sí: sábanas y toallas. En las parcelas, cada uno trae lo suyo." }
      - { pregunta: "¿Se puede llegar andando a la Ruta del Cares?", respuesta: "Sí. Poncebos, donde empieza la ruta, está a dos kilómetros por un camino junto al río." }
      - { pregunta: "¿Puedo cancelar?", respuesta: "Cancelación gratuita hasta siete días antes de la llegada. Después se cobra la primera noche." }

